name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - develop
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
     
      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}  
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build a push do GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ format('ghcr.io/{0}:latest', toLower(github.repository)) }}
